[package]
name = "desk-island"
version = "0.1.0"
description = "Dynamic Island untuk Windows 10/11"
authors = ["Desk Island"]
edition = "2021"

[lib]
name = "desk_island_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.12", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.39"
rusqlite = { version = "0.41.0", features = ["bundled"] }
tauri-plugin-global-shortcut = "2"

[target.'cfg(windows)'.dependencies]
auto-launch = "0.6"
base64 = "0.22"
png = "0.17"
windows = { version = "0.62", features = [
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_SystemInformation",
    "Win32_System_Variant",
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_UI_Controls",
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
    "Win32_UI_Shell",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Devices_FunctionDiscovery",
    "Foundation",
    "Foundation_Collections",
    "Media_Control",
] }

[dev-dependencies]
windows-future = "0.3"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
